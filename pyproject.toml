[project]
name = "framebuffer"
version = "2026.10.28"
dependencies = [
    "pillow ~= 12.2.0",
    "numpy ~= 2.4.4",
    "numba ~= 0.68.1",
    "scipy ~= 1.18.1"
]
description = "A basic game and rendering engine utilising the terminal as display."
readme = "README.md"
requires-python = ">=3.14"

[project.optional-dependencies]
test = [
    "ruff ~= 0.15.12",
    "mypy ~= 2.1.0",
]

[build-system]
requires = ["setuptools ~= 82.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
exclude = [
    ".venv/",
    ".idea/",
    ".ruff_cache/",
    ".mypy_cache/",
    "resources/",
    "__pycache__/",
    "build/",
    "LICENSE",
    ".gitignore",
    "framebuffer.egg-info/"
]
indent-width = 4
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"